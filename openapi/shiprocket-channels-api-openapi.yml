    post:
      summary: Create Custom Channel
      description: 'Creates a new manual (custom) channel in the seller''s Shiprocket account.

        Pre-condition: This endpoint is gated. Your account must be allow-listed for "Channel Creation by API" by the Shiprocket Tech Support / KAM team before it will work.

        Request body

        Error responses

        401 Unauthorized — Missing or invalid bearer token.

        403 Forbidden — "Channel Creation by API" flag is not enabled for your account, or channel limit reached.

        422 Unprocessable Entity — Validation failure (name missing, name > 12 chars, name already exists, or brand_name > 50 chars).

        Notes

        Default order-status mapping is applied automatically (matches the canonical mapping used when you create a manual channel from the Shiprocket dashboard).'
      operationId: createCustomChannel
      tags:
      - Channels
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                brand_name:
                  type: string
            example:
              name: MANUAL-25149
              brand_name: SIORA-12
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    channel_id: 123456
                    name: MANUAL-25149
                    brand_name: SIORA-12
                    base_channel_code: CUSTOM
                    status: 1
                    company_id: 25149
                    created_at: '2026-04-29 12:34:56'
              schema:
                type: object
                properties:
                  channel_id:
                    type: integer
                  name:
                    type: string
                  brand_name:
                    type: string
                  base_channel_code:
                    type: string
                  status:
                    type: integer
                  company_id:
                    type: integer
                  created_at:
                    type: string
