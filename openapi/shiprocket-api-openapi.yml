              : \"\",\n        \"serial_no\": \"790878\",\n        \"ean_barcode\": \"\",\n        \"check_damaged_product\"\
              : true\n}"
      responses:
        '201':
          description: Successful Call
        '422':
          description: Missing Fields
          content:
            application/json:
              examples:
                Missing-Fields:
                  value:
                    message: There were errors in adding new product!
