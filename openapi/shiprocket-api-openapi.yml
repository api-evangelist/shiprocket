  /v1/external/errors/{import_id}/check:
    get:
      summary: Get File import Results
      description: "Check the import response of various file imports for any error, including bulk order imports, products\
        \ and product listings.\n You will have to pass the file import id as a path parameter in the endpoint URL. This id\
        \ is provided at the time of importing the file.\nNo other body parameters are required. \n Path:"
      operationId: getFileImportResults
      tags:
      - File Imports
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    data:
                      status: '3'
                      message: Error in reading file data! Please check that the column names are same as that in the sample
                        file provided.
              schema:
                type: object
                properties:
                  data:
