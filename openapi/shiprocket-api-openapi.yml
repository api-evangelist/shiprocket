  /v1/external/orders/address/pickup:
    patch:
      summary: Change/Update Pickup Location of Created Orders
      description: "Using this API, you can modify the pickup location of an already created order. Multiple order ids can\
        \ be passed to update their pickup location together.\n Note: \n Pickup location can only be changed/updated to an\
        \ already existing pickup location in your account. \n The 'order_id' to be passed is the Shiprocket order_id received\
        \ at the time of order creation.\n Multiple order ids can be passed as an array, separated by commas. eg: [\"141414,142424,143434\"\
        ]\n Parameters:"
      operationId: changeUpdatePickupLocationOfCreatedOrders
      tags:
      - Create Or Update Order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: array
                  items: {}
                  description: The Shiprocket order_id specified to the order.
                pickup_location:
                  type: string
                  description: The pickup location you want to change your current pickup location to.
              required:
              - order_id
              - pickup_location
            example:
              order_id: []
              pickup_location: ''
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    message: Pickup location Updated
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid Data
          content:
            application/json:
              examples:
                Invalid-Data:
                  value:
                    message: Pickup Code does not exist
                    status_code: 400
                Missing-Fields:
                  value:
                    message: Order Id does not exists
                    status_code: 400
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status_code:
                    type: integer
        '500':
          description: Wrong Format
          content:
            application/json:
              examples:
                Wrong-Format:
                  value:
                    message: Invalid argument supplied for foreach()
                    status_code: 500
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status_code:
                    type: integer
  /v1/external/orders/address/update:
    post:
      summary: Update Customer Delivery Address
      description: "You can update the customer's name and delivery address through this API by passing the Shiprocket order\
        \ id and the necessary customer details.\n Parameters:"
      operationId: updateCustomerDeliveryAddress
      tags:
      - Create Or Update Order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
