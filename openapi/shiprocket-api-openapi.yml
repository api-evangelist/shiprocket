  /v1/external/international/courier/assign/awb:
    post:
      summary: AWB Assignment
      description: This API can be used to assign the AWB (Air Waybill Number) to your shipment. The AWB is a unique number
        that helps you track the shipment and get details about it.
      operationId: awbAssignment
      tags:
      - International
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shipment_id:
                  type: integer
                  description: The shipment id of the order you want to create the AWB for.
                courier_id:
                  type: integer
                  description: The courier id of the courier service you want to select. The default courier is selected in
                    case no id is specified.
                status:
                  type: string
                  description: 'Use this to change the courier of a shipment. Value: reassign. Note that this can be done
                    only once in 24 hours.'
              required:
              - shipment_id
            example:
              shipment_id: 160169474
              courier_id: 332
              status: reassign
      responses:
        '200':
          description: AWB Assignment Failed
          content:
            application/json:
              examples:
                AWB-Assignment-Failed:
                  value:
                    awb_assign_status: 0
                    response:
                      data:
                        awb_assign_error: Awb Assignment Failed
              schema:
                type: object
                properties:
                  awb_assign_status:
                    type: integer
                  response:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          awb_assign_error:
                            type: string
        '400':
          description: Invalid Courier Provided
          content:
            application/json:
              examples:
                Invalid-Courier-Provided:
                  value:
                    message: Uh-oh! Invalid Courier for international shipment!
              schema:
                type: object
                properties:
                  message:
                    type: string
  /v1/external/international/manifests/generate:
    post:
      summary: Manifest Generation
      description: "Use this API to create a pickup request for your order shipment. The API returns the pickup status along\
        \ with the estimated pickup time. You will have to call the 'Generate Manifest' API after the successful response\
        \ of this API.\n Note: \n The AWB must be already generated for the shipment id to generate the pickup request.\n\
        \ Only one shipment_id can be passed at a time."
      operationId: manifestGeneration
      tags:
      - International
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shipment_id:
                  type: array
                  items:
                    type: integer
                  description: The shipment id of the shipment which is requested for pickup.
              required:
              - shipment_id
            example:
              shipment_id:
              - 12345
