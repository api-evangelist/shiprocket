      tags:
      - Products
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            example: "{\n\t \"name\": \"Batman451\",\n    \"category_code\": \"default\",\n    \"type\": \"Single\",\n   \
              \ \"qty\": \"10\",\n    \"sku\": \"b118771212\",\n    \"qc_details\": {\n        \"product_image\": \"https://kr-multichannel-stage.s3.ap-south-1.amazonaws.com/1310/qc_product_img/538c2939-24e7-4b60-98cd-b13cee264c1e.jpg\"\
