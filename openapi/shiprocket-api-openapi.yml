      description: "Use this API to add a new product to your Shiprocket account. Provide the required product details and\
        \ any additional info to successfully add a new product to your product list.\n Notes: \n 'sku' Id has to be unique.\
        \ It cannot be the same as an existing sku.\n In case no category code is added, the code should be default.\n 'type'\
        \ field should be either 'single' or 'multiple.'\n Parameters:"
