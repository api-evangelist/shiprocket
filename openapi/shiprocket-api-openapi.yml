  /v1/external/orders/export:
    post:
      summary: Export your orders
      description: "This API downloads and creates a CSV file of all the orders in your Shiprocket account and sends the download\
        \ URL to the linked email account of the API user.\n The CSV file containing is accessible via this URL.\nNo parameters\
        \ are required to access this API."
      operationId: exportYourOrders
      tags:
      - Orders
      - Hyperlocal
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example: {}
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    status: 200
                    is_background_downloading: 1
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  is_background_downloading:
                    type: integer
        '502':
          description: Invalid Endpoint
          content:
            text/html:
              examples:
                Invalid-Endpoint:
                  value: "<html>\n    <head>\n        <title>502 Bad Gateway</title>\n    </head>\n    <body bgcolor=\"white\"\
                    >\n        <center>\n            <h1>502 Bad Gateway</h1>\n        </center>\n        <hr>\n        <center>nginx</center>\n\
                    \    </body>\n</html>"
  /v1/external/orders/create/return:
    post:
      summary: Create a Return Order
      description: "Use this API to create a new return order in your Shiprocket panel. Return orders are created in case\
        \ the buyer refuses/rejects/returns a specific order. The parameter specifications are the same as the custom order\
        \ API, with a few exceptions.\n Parameters:\n Possible return_reason values :\n 1. Bought by Mistake\n2. Better price\
        \ available\n3. Performance or quality not adequate\n4. Incompatible or not useful\n5. Product damaged, but shipping\
        \ box OK\n6. Item arrived too late\n7. Missing parts or accessories\n8. Both product and shipping box damaged\n9.\
        \ Wrong item was sent\n10. Item defective or doesn't work\n11. No longer needed\n12. Didn't approve purchase\n13.\
        \ Inaccurate website description\n14. Return against replacement\n15. Delay Refund\n16. Delivered Late\n17. Product\
        \ does not Match Description on Website\n18. Both Product & Outer Box Damaged\n19. Defective or does not work\n20.\
        \ Product damaged, but outer Box OK\n21. Missing Parts or Accessories\n22. Incorrect Item Delivered\n23. Product Defective\
        \ or Doesn't Work\n24. Product performance/quality is not up to my expectations\n25. Other\n26. Changed my mind\n\
        27. Does not fit\n28. Size not as expected\n29. Item is damaged\n30. Received wrong item\n31. Parcel damaged on arrival\n\
        32. Quality not as expected\n33. Missing Item or accessories\n34. Performance not adequate\n35. Not as described\n\
        36. Arrived too late\n37. Order Not Received\n38. Empty Package\n39. Wrong item or Wrong colour was sent\n40. Item\
        \ defective, expired, spoilt or does not work\n41. Items or parts missing\n42. Size or Quantity issues\n43. Status\
        \ as delivered but order not received\n44. N/A"
      operationId: createAReturnOrder
      tags:
      - Return & Exchange Orders
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                  description: 'The order id you want to specify to the order. Max char: 50. (Avoid passing character values
                    as this contradicts some other API calls)'
                order_date:
                  type: string
                  description: The date of order creation in yyyy-mm-dd format. Time is an additional option.
                channel_id:
                  type: integer
                  description: Id of the desired channel where the order is to be placed. 'Custom' channel id is selected
                    in case parameter is not filled.
                pickup_customer_name:
                  type: string
                  description: The customer’s first name.
                pickup_last_name:
                  type: string
                  description: The customer’s last name.
                company_name:
                  type: string
                pickup_address:
                  type: string
                  description: The customer's primary address.
                pickup_address_2:
                  type: string
                  description: Additional customer address details.
                pickup_city:
                  type: string
                  description: The customer's city name.
                pickup_state:
                  type: string
                  description: The customer's state.
                pickup_country:
                  type: string
                  description: Customer's country name.
                pickup_pincode:
                  type: integer
                  description: Pincode of the customer address.
                pickup_email:
                  type: string
                  description: Customer's email address.
                pickup_phone:
                  type: string
                  description: Customer's phone number.
                pickup_isd_code:
                  type: string
                  description: ISD code.
                shipping_customer_name:
                  type: string
                  description: The name of the seller the package is shipped back to.
                shipping_last_name:
                  type: string
                  description: The last name of the seller.
                shipping_address:
                  type: string
                  description: The address the package is shipped to.
                shipping_address_2:
                  type: string
                  description: Further shipping address details.
                shipping_city:
                  type: string
                  description: The shipping address city.
                shipping_country:
                  type: string
                  description: The shipping address country.
                shipping_pincode:
                  type: integer
                  description: The shipping pincode.
                shipping_state:
                  type: string
                  description: Shipping address state.
                shipping_email:
                  type: string
                  description: The email of the seller the package is shipped to.
                shipping_isd_code:
                  type: string
                  description: The shipping isd code.
                shipping_phone:
                  type: integer
                  description: Phone no. of the shipping customer
                order_items:
                  type: array
                  items:
                    type: object
                    properties:
                      sku:
                        type: string
                      name:
                        type: string
                      units:
                        type: integer
                      selling_price:
                        type: integer
                      discount:
                        type: integer
                      qc_enable:
                        type: boolean
                      hsn:
                        type: string
                      brand:
                        type: string
                      qc_size:
                        type: string
                  description: Array containing further fields.
                payment_method:
                  type: string
                  description: The method of payment. This should always be prepaid.
                total_discount:
                  type: string
                  description: The total discount amount in Rupee.
                sub_total:
                  type: integer
