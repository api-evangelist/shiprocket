                properties:
                  message:
                    type: string
                  status_code:
                    type: integer
  /v1/external/courier/generate/label:
    post:
      summary: Generate Label
      description: "Generate the label of order by passing the shipment id in the form of an array.\nThis API displays the\
        \ URL of the generated label.\n Note: \n The AWB must be assigned to the shipment to generate the label.\n 'shipment_id'\
        \ must be passed as an array.\n Parameters:"
      operationId: generateLabel
      tags:
      - Labels | Manifests | Invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shipment_id:
                  type: array
                  items: {}
                  description: The shipment id of the order whose label is to be generated. Multiple ids can be passed together
                    as an array.
              required:
              - shipment_id
            example:
              shipment_id: []
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    label_created: 1
                    label_url: https://kr-shipmultichannel.s3.ap-southeast-1.amazonaws.com/25149/labels/shipping-label-16104408-788830567028.pdf
                    response: Label has been created and uploaded successfully!
                    not_created: []
                Missing-or-Invalid-Data:
                  value:
                    label_created: 0
                    not_created: []
