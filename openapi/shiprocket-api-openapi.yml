  /v1/external/courier/generate/label-invoice:
    post:
      summary: Generate Label + Invoice (Combined)
      description: "Generates a single combined PDF containing the shipping label followed by the invoice for each shipment.\
        \ Output preserves the input order of shipment_ids .\n Note: \n shipment_ids is mandatory for external requests.\n\
        \ Not supported for reseller-enabled accounts.\n completed: true in the response means the request ran synchronously\
        \ (always true for external callers) — it does not guarantee every shipment succeeded. Check success_count / error_count\
        \ ; on partial/full failure error_file_url points to the error details.\n Parameters:"
      operationId: generateLabelInvoiceCombined
      tags:
      - Labels | Manifests | Invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shipment_ids:
                  type: array
                  items: {}
                  description: Shipment IDs to generate the combined label+invoice for. Multiple ids can be passed as an array.
                    Max 200 per request.
              required:
              - shipment_ids
            example:
              shipment_ids: []
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    completed: true
                    file_url: https://shiprocket.s3.amazonaws.com/combined-label-invoice.pdf
                    error_file_url: ''
                    success_count: 2
                    error_count: 0
              schema:
                type: object
                properties:
                  completed:
                    type: boolean
                  file_url:
                    type: string
                  error_file_url:
                    type: string
                  success_count:
                    type: integer
                  error_count:
                    type: integer
        '400':
          description: Missing or Invalid Data
          content:
            text/plain:
              examples:
                Missing-or-Invalid-Data:
                  value: '{\n    \"message\": \"shipment_ids is required for external requests\"\n}'
                Max-Limit-Exceeded:
                  value: '{\n    \"message\": \"Max 200 shipment_ids allowed per external request\"\n}'
                Reseller-Not-Supported:
                  value: '{\n    \"message\": \"Combined label+invoice not supported for reseller setup\"\n}'
