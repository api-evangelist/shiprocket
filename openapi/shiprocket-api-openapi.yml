                        channel_order_id:
                          type: string
                        awb_code:
                          type: string
                        return_awb_code: {}
                        applied_weight:
                          type: string
                        charged_weight:
                          type: string
                        billed_weight:
                          type: string
                        action:
                          type: string
                        charge:
                          type: string
                        description:
                          type: string
                        debit_amount:
                          type: string
                        credit_amount:
                          type: string
                        balance_amount:
                          type: string
                        balance_weight:
                          type: integer
                        volumetric_weight:
                          type: string
                        entered_weight:
                          type: string
                        created_at:
                          type: string
                        can_ship:
