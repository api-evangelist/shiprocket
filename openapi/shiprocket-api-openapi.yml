  /v1/external/international/settings/international_kyc:
    post:
      summary: International KYC
      description: Use this API for your international KYC. This API return your KYC status. Please check the documentation
        for the documents for KYC.
      operationId: internationalKYC
      tags:
      - International
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_type:
                  type: string
                  description: Seller organization
                ip_address:
                  type: integer
                  description: Seller's ip_address
                documents:
                  type: array
                  items:
                    type: object
                    properties:
                      attachment:
                        type: array
                        items:
                          type: object
                          properties:
                            file:
                              type: string
                            extension:
                              type: string
                      document_name:
                        type: string
                      document_value:
                        type: string
                  description: Documentaion for organization type (document size is not greater than 3 MB)
            example:
              organization_type: Sole Proprietor
              ip_address: 35.207.230.249
              documents:
              - attachment:
                - file: 
                  extension: pdf
                document_name: iec_code
                document_value: 0514039752
              - attachment:
                - file: 
                  extension: pdf
                document_name: ad_code
                document_value: '63919662900009'
              - attachment:
                - file: 
                  extension: pdf
                document_name: gstin_certificate
                document_value: 07AESPG5142H1ZE
              - attachment:
                - file: 
                  extension: pdf
                document_name: pan_card
                document_value: AESPG5142H
              - attachment:
                - file: 
                  extension: pdf
                document_name: aadhar_card
                document_value: '613168861273'
      responses:
        '200':
          description: Sucess Response
          content:
            application/json:
              examples:
                Sucess-Response:
                  value:
                    success: true
                    message: Document is successfully updated!
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /v1/external/international/settings/add-bank-details:
    post:
      summary: Add Bank Details
      description: ThisdocumentationprovidesinformationabouttheBankDetailsAPI,whichallowsyouto addbankdetailsforinternationalsettings.TheAPIendpoint,
        parameters, request sample data, success response , and failed response are outlined below.
      operationId: addBankDetails
      tags:
      - International
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_account_type:
                  type: string
                  description: ankaccounttype.Mustbe either"saving"or"current".
                beneficiary_name:
                  type: string
                  description: Beneficiaryname. Alphabetsandspacesonly
                bank_ifsc_code:
                  type: string
                  description: BankIFSCcode.Must followaspecificpattern
                bank_account_number:
                  type: integer
                  description: Bankaccountnumber. Shouldbebetween9and 18digits.
              required:
              - bank_account_type
              - beneficiary_name
              - bank_ifsc_code
              - bank_account_number
            example:
              bank_account_type: saving
              beneficiary_name: JohnDoe
              bank_ifsc_code: ABCD0123456
              bank_account_number: '1234567890'
      responses:
        '200':
          description: Success (no example response published in the collection)
  /v1/external/international/orders/create/adhoc:
    post:
      summary: Create order
      description: "Use this API to create a quick custom order. Quick orders are the ones where we do not store the product\
        \ details in the master catalogue.\n You have to pass all the required params at the minimum to create a quick custom\
        \ order. You can add additional parameters as per your preference.\n Note: \n In case the 'shipping_is_billing' field\
        \ is false, further shipping detail fields are required.\n If no channel id is passed, the order will be assigned\
        \ to the default custom channel. If the channel id is not known, use the 'Get All Channels' API to get the list of\
        \ all integrated channels in your Shiprocket account.\n order_id field cannot be equal to an already existing id.\
        \ Doing so does not change or affect the existing order.\n New orders cannot be created with order id's same as that\
        \ of cancelled orders. If error 422 shows up despite filling in the correct details, consider changing the order_id.\n\
        \ Be sure to input the correct calculated sub_total amount. The total is not calculated automatically through the\
        \ API.\n The 'order_id' returned in the response is the Shiprocket order_id. Please save this order ID as we will\
        \ use this in future API calls.\n Parameters:"
      operationId: createOrder
      tags:
      - International
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                  description: 'The order id you want to specify to the order. Max char: 50. (Avoid passing character values
                    as this contradicts some other API calls).'
                isd_code:
                  type: string
                billing_isd_code:
                  type: string
                  description: ISD code of the billing address.
                order_date:
                  type: string
                  description: The date of order creation in yyyy-mm-dd format. Time is additional.
                channel_id:
                  type: integer
                  description: Mention this in case you need to assign the order to a particular channel. Deafult is 'Custom'.
                billing_customer_name:
                  type: string
                  description: First name of the billed customer.
                billing_last_name:
                  type: string
                  description: Last name of the billed customer.
                billing_address:
                  type: string
                  description: address details of the billed customer.
                billing_address_2:
                  type: string
                  description: Further address details of the billed customer.
                billing_city:
                  type: string
                  description: 'Billing address city. Max char: 30.'
                billing_state:
                  type: string
                  description: Billing address state.
                billing_country:
                  type: string
                  description: Billing address country.
                billing_pincode:
                  type: integer
                  description: Pincode of the billing address.
                landmark:
                  type: string
                shipping_is_billing:
                  type: integer
                  description: Whether the shipping address is the same as billing address. 1 or 'true' for yes and 0 or 'false'
                    for no.
                shipping_customer_name:
                  type: string
                  description: Name of the customer the order is shipped to. Required in case billing is not same as shipping.
                shipping_last_name:
                  type: string
                  description: Last name of the shipping customer.
                shipping_address:
                  type: string
                  description: Address of the Shipping customer. Required in case billing is not same as shipping.
                shipping_address_2:
                  type: string
                  description: Further address details of shipping customer.
                shipping_city:
                  type: string
                  description: Shipping address city.
                order_type:
                  type: integer
                  description: Key to differentiate between Essentials or Non Essentials Shipments. Order type can only be
                    ESSENTIALS or NON ESSENTIALS. Please note it is case sensitive and blank values are allowed.
                shipping_country:
                  type: string
                  description: Shipping address country.
                shipping_pincode:
                  type: integer
                  description: Shipping address pincode.
                shipping_state:
                  type: string
                  description: Shipping address state.
                shipping_email:
                  type: string
                  description: Email of the shipping customer.
                product_category:
                  type: string
                shipping_phone:
                  type: integer
                  description: Phone no. of the shipping customer.
                billing_alternate_phone:
                  type: integer
                  description: Alternate phone number of the billing customer.
                order_items:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      sku:
                        type: string
                      category_name:
                        type: string
                      tax:
                        type: string
                      hsn:
                        type: string
                      units:
                        type: string
                      selling_price:
                        type: string
                      discount:
                        type: string
                      category_id:
                        type: string
                      caetgroy_code:
                        type: string
                  description: List of items and their relevant fields in the form of Array.
                payment_method:
                  type: string
                  description: The method of payment. Can be either COD (Cash on delivery) Or Prepaid.
                shipping_charges:
                  type: integer
                  description: Shipping charges if any in Rupee.
                giftwrap_charges:
                  type: integer
                  description: Giftwrap charges if any in Rupee.
                transaction_charges:
                  type: integer
                  description: Transaction charges if any in Rupee.
                total_discount:
                  type: integer
                  description: The total discount amount in Rupee.
                sub_total:
                  type: integer
                  description: Calculated sub total amount in Rupee after deductions.
                weight:
                  type: number
                  description: The weight of the item in kgs. Must be more than 0.
                length:
                  type: integer
                  description: The length of the item in cms. Must be more than 0.5.
                breadth:
                  type: integer
                  description: The breadth of the item in cms. Must be more than 0.5.
                height:
                  type: integer
                  description: The height of the item in cms. Must be more than 0.5.
                pickup_location_id:
                  type: integer
                reseller_name:
                  type: string
                  description: 'The ''from'' name if you want to print. Use ''Reseller: [name]'''
                company_name:
                  type: string
                  description: Name of the company.
                ewaybill_no:
                  type: string
                  description: Details relating to the shipment of goods. .
                customer_gstin:
                  type: string
                  description: Goods and Services Tax Identification Number.
                is_order_revamp:
                  type: integer
                is_document:
                  type: integer
                delivery_challan:
                  type: boolean
                order_tag:
                  type: string
                purpose_of_shipment:
                  type: integer
                  description: The purpose of the shipment. values are 0 - gift, 1- sample, commercial - 2.
                currency:
                  type: string
                  description: The currency of the order. Possible values are INR,USD,GBP, EUR, AUD, CAD, SAR, AED,SGD
                reasonOfExport:
                  type: integer
                  description: The reason for the export. Possible values are 0 - BONAFIDE_SAMPLE, 1 - SAMPLE, 2 - GIFT, 3
                    - COMMERCIAL
                commodity:
