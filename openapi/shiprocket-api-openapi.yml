      description: "This API is used to update your product inventory details.\n First, you need to pass the product_id of\
        \ the product in the endpoint URL.\nYou can then set the quantity and action you want to perform on the existing inventory\
        \ of the specified product.\n Note: \n The product_id can be found using the 'Get Inventory Details' API.\n The id\
        \ is to be passed in the endpoint URL itself.\n Path:\n Parameters:"
      operationId: updateYourInventory
      tags:
      - Inventory
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  description: The quantity of the product you want.
                action:
                  type: integer
                  description: 'The action you want to perform. Value : - add : Adds the specific quantity to the product
                    inventory. - replace : Replaces the existing quantity with the specified number. - remove : Removes the
                    specific number from the product inventory.'
