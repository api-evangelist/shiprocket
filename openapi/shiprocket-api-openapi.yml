              - quantity
              - action
            example:
              quantity: ''
              action: ''
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    data:
                      available_quantity: 51
                      blocked_quantity: 0
