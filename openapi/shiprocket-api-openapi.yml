  /v1/external/blocked-pincodes/upload:
    post:
      summary: Upload Blocked Pincodes
      description: "Adds pincodes to the seller's delivery‑block list, or removes them.\n The block action runs per‑pincode\
        \ classification — valid entries are saved, invalid or duplicate entries are recorded in Activity Logs as a downloadable\
        \ CSV instead of failing the whole request. The unblock action is all‑or‑nothing : the first invalid pincode aborts\
        \ the call.\n Authentication\n Pass the bearer token via header or query parameter:\n Request Body Parameters\n Notes\n\
        \ Idempotency — block is naturally idempotent. unblock is similarly idempotent for already‑removed pincodes.\n Request\
        \ size cap — 1 MiB.\n Unblock does not write to Activity Logs — only block produces a per‑pincode result CSV; unblock\
        \ surfaces the first malformed entry inline in the response.\n Timestamps — stored in IST ( Asia/Kolkata )."
      operationId: uploadBlockedPincodes
      tags:
      - Couriers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                postcode:
                  type: object
                  properties:
                    delivery_blocked:
                      type: array
                      items:
                        type: string
                action:
                  type: string
            example:
              postcode:
                delivery_blocked:
                - '110001'
                - '560034'
              action: block
      responses:
        '200':
          description: Success (no example response published in the collection)
      servers:
      - url: https://serviceability.shiprocket.in
        description: Serviceability service host (as published in the collection)
  /v1/external/block-pincodes/get:
    get:
      summary: Get Blocked Pincodes
      description: "Reads the seller's delivery‑block list. Multi‑mode — the mode is selected by query parameters:\n Only\
        \ delivery_blocked data is exposed. \n Authentication\n Pass the bearer token via header or query parameter:\n Query\
        \ Parameters\n Mode Precedence\n is_download=1 — wins over everything\n search (non‑empty after trim) — wins over\
        \ pagination\n Default — paginated list\n Notes\n Search isn't validated server‑side — pass any string; the server\
        \ does prefix matching as‑is.\n CSV download URL is presigned for 24 hours — generate a fresh link by calling the\
        \ endpoint again after expiry.\n per_page is silently capped at 15; values above 15 are treated as 15."
