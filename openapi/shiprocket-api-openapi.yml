                total_discount:
                  type: integer
                  description: The total discount amount in Rupee.
                sub_total:
                  type: integer
                  description: Calculated sub total amount in Rupee.
                length:
                  type: integer
                  description: The length of the item in cms. Must be more than 0.5.
                breadth:
                  type: integer
