  /v1/external/courier/serviceability:
    get:
      summary: Check Courier Serviceability
      description: "Use this API to check the availability of couriers between the pickup and delivery postal codes. Further\
        \ details like the estimated time of delivery, the rates along with the ids are also shown.\n Note: \n One of either\
        \ the 'order_id' or 'cod' and 'weight' is required. If you specify the order id, the cod and weight fields are not\
        \ required and vice versa.\n You can add further fields to add the shipment details and filter the search.\n Parameters:"
      operationId: checkCourierServiceability
      tags:
      - Couriers
      - Return & Exchange Orders
      - Hyperlocal
      parameters:
      - name: pickup_postcode
        in: query
        schema:
          type: integer
        description: Postcode from where the order will be picked.
        required: true
      - name: delivery_postcode
        in: query
        schema:
          type: integer
        description: Postcode where the order will be delivered
        required: true
      - name: order_id
        in: query
        schema:
          type: integer
        description: If order id is already created in Shiprocket panel then you can use this shiprocket order id in servicibility
      - name: cod
        in: query
        schema:
          type: boolean
        description: 1 for Cash on Delivery and 0 for Prepaid orders.
      - name: weight
        in: query
        schema:
          type: string
        description: The weight of shipment in kgs.
      - name: length
        in: query
        schema:
          type: integer
        description: The length of the shipment in cms.
      - name: breadth
        in: query
        schema:
          type: integer
        description: The breadth of the shipment in cms.
      - name: height
        in: query
        schema:
          type: integer
        description: The height of the shipment in cms.
      - name: declared_value
        in: query
        schema:
          type: integer
        description: The price of the order shipment in rupees.
      - name: mode
        in: query
        schema:
          type: string
        description: 'The mode of travel. Either: Surface or Air'
      - name: is_return
        in: query
        schema:
          type: integer
        description: Whether the order is a return order or not. 1 in case of Yes and 0 for No. (declared_value field is required
          in case you use this parameter)
      - name: couriers_type
        in: query
        schema:
          type: integer
        description: Use this to filter out and show only "documents" couriers like XB documents, etc. The only accepted value
          is 1.
      - name: only_local
        in: query
        schema:
          type: integer
        description: Use this to filter out and show only Hyperlocal couriers. The only accepted value is 1.
      - name: qc_check
        in: query
        schema:
          type: integer
        description: Use this filter to show only the QC-enabled couriers. is_return has to be set to 1
      responses:
