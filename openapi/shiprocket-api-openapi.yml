              schema:
                type: object
                properties:
                  message:
                    type: string
  /v1/external/manifests/generate:
    post:
      summary: Generate Manifest
      description: "Using this API, you can generate the manifest for your order.\nThis API generates the manifest and displays\
        \ the download URL of the same.\n Note: \n Multiple ids can also be passed as an array for bulk generation of manifests.\n\
        \ AWB must be assigned and pickup requested on the shipment id to generate manifest.\n Parameters:"
      operationId: generateManifest
      tags:
      - Labels | Manifests | Invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shipment_id:
                  type: array
                  items: {}
                  description: The shipment id of the order. Multiple ids can be passed as an array, separated by commas.
              required:
              - shipment_id
            example:
              shipment_id: []
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    status: 1
                    manifest_url: https://s3-ap-southeast-1.amazonaws.com/kr-shipmultichannel/25149/manifest/MANIFEST-3051.pdf
                Missing-Field-or-Invalid-Data:
                  value:
                    status: 1
                    manifest_url: ''
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  manifest_url:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                Bad-Request:
                  value:
                    message: Manifest already generated for some shipment_ids, Please try again after removin them
                    status_code: 400
                    already_manifested_shipment_ids:
                    - 16090109
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status_code:
                    type: integer
                  already_manifested_shipment_ids:
                    type: array
                    items:
                      type: integer
  /v1/external/manifests/print:
    post:
      summary: Print Manifest
      description: "Use this API to print the generated manifest of orders at an individual level.\n Note \n Manifest needs\
        \ to be generated first for this API to print it. Use the 'Generate Manifest' API to do the same.\n Multiple order\
        \ ids can be passed together.\n Parameters:"
      operationId: printManifest
      tags:
      - Labels | Manifests | Invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_ids:
                  type: array
                  items: {}
                  description: The Shiprocket order id of whose manifest is to be generated. Multiple ids can be passed together
                    as an array.
              required:
              - order_ids
            example:
              order_ids: []
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
