  /v1/external/products/qc-product-update/{productID}:
    post:
      summary: Convert to QC Product
      description: 'Use this API to convert an existing product to a QC product. The {productID} will be the "id" from the " Get all products " or " Get specific product details " API.

        Parameters:'
      operationId: convertToQCProduct
      tags:
      - Products
      parameters:
      - name: productID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  description: Stock Keeping Unit or the identification unit of an individual product (generally alphanumeric).
                product_image:
                  type: string
                  description: Pickup agent will cross check shared product color with the actual product received from the buyer. Mandatory for all QC Products
                brand_box:
                  type: string
                  description: The pickup agent will cross-check the provided brand name, which should match the brand tag affixed to the item(s) upon delivery
                brand:
                  type: integer
                  description: The pickup agent will cross-check the provided brand name visible on the item(s) or its packaging.
                color:
                  type: string
                  description: Pickup agent will cross check shared product color with the actual product received from the buyer.
                size:
                  type: string
                  description: Pickup agent will cross check shared product size with the size on the label/tag.
                serial_no:
                  type: string
                  description: A serial number (SN) is a unique alphanumeric value assigned to each individual product.
                check_damaged_product:
                  type: integer
              required:
              - sku
              - product_image
            example:
              sku: PROD12345
              product_image: https://kr-multichannel.s3.ap-southeast-1.amazonaws.com/2/products/images/1640350781_08d63a46-a0f1-4d6b-9eea-9e476fce7c4e1575377853407-HIGHLANDER-by-Rohit-Sharma-Men-White--Blue-Slim-Fit-Checked--1.j
              brand_box: 12323chacha
              brand: blue
              color: Red
              size: M
              serial_no: ''
              check_damaged_product: 0
      responses:
        '200':
          description: Success (no example response published in the collection)
  /v1/external/products/import:
    post:
      summary: Bulk Import Products
      description: Use this API to import your products in bulk from a .csv file. No parameters are required. Choose the target file as required. You will receive an import id upon successful import operation.
      operationId: bulkImportProducts
      tags:
      - Products
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    id: 20290943
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '422':
          description: Missing Fields
          content:
            application/json:
              examples:
                Missing-Fields:
                  value:
                    message: Oops! Something went wrong.
                    errors:
                      file:
                      - The file field is required.
                    status_code: 422
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      file:
                        type: array
                        items:
                          type: string
                  status_code:
                    type: integer
  /v1/external/products/sample:
    get:
      summary: Get Sample .csv Format
      description: 'This API will provide a sample format for a CSV file that can be used for importing orders. You can use this format to create your CSV file, which you want to use to import products into your Shiprocket account.

        No additional parameters are required.'
      operationId: getSampleCsvFormat
      tags:
      - Products
      responses:
        '200':
          description: Successful Call
          content:
            application/csv:
              examples:
                Successful-Call:
                  value: '"Category Name","*Master Sku Code","*Product Name","Low Stock Warning At","Description","Length (cm)","Width (cm)","Height (cm)","Weight (kgs)","ean","upc","isbn","Color","Brand","Size","Tax Code","Image Url","Custom Detail Fields (IMEI/SerialNumber)","MRP","Cost Price","Active(True/False)","Type(Single)","HSN code"

