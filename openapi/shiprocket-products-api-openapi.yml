openapi: 3.2.0
info:
  title: Shiprocket Products API
  version: v1
  description: 'Shiprocket''s public REST API (v1/external) for eCommerce shipping and order management: authentication, order create/update/cancel/import, courier serviceability and AWB assignment, pickup scheduling, labels/manifests/invoices, shipment tracking, NDR actions, returns and exchanges, hyperlocal and international shipping, products, listings, channels, inventory, countries/postcodes, wallet balance, statements and discrepancies.'
  termsOfService: https://www.shiprocket.in/terms-conditions/
  contact:
    name: Shiprocket API integration support
    email: integration@shiprocket.com
    url: https://apidocs.shiprocket.in/
servers:
- url: https://apiv2.shiprocket.in
  description: Production
security:
- bearerAuth: []
tags:
- name: Products
  description: Use these APIs to get information on your added products or update their details. You can also add a new product or import them in bulk.
paths:
  /v1/external/products:
    get:
      summary: Get All Products
      description: 'This API can be used to display a detailed list of all the products that you have in your Shiprocket account.

        There are no required parameters to access this API. However, the displayed result can be filtered or sorted using additional parameters.

        Parameters:'
      operationId: getAllProducts
      tags:
      - Products
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        description: The page number you want to display.
      - name: per_page
        in: query
        schema:
          type: integer
        description: The number of products to get per page.
      - name: sort
        in: query
        schema:
          type: string
        description: 'The order to sort by. Value: ASC or DESC'
      - name: sort_by
        in: query
        schema:
          type: string
        description: Allows you to choose the value field by which the items will be sorted. Could be sorted by id, by sku, time created etc.
      - name: filter
        in: query
        schema:
          type: string
        description: The data to be matched for the filter value.
      - name: filter_by
        in: query
        schema:
          type: string
        description: The filter value field . Can be id, sku, etc.
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    data:
                    - id: 17484610
                      sku: chakra123
                      hsn: '441122'
                      name: Kunai
                      description: ''
                      category_code: default
                      category_name: Default Category
                      category_tax_code: ''
                      image: ''
                      weight: 0 kg
                      size: ''
                      cost_price: '0.00'
                      mrp: '0.00'
                      tax_code: default
                      low_stock: 0
                      ean: ''
                      upc: ''
                      isbn: ''
                      created_at: 31 Jul 2019 12:37 PM
                      updated_at: 31 Jul 2019 03:18 PM
                      quantity: 41
                      color: ''
                      brand: ''
                      dimensions: 10 x 10 x 10 cm
                      status: INACTIVE
                      type: Single
