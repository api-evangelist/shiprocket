    post:
      summary: Add New Products
      description: 'Use this API to add a new product to your Shiprocket account. Provide the required product details and any additional info to successfully add a new product to your product list.

        Notes:

        ''sku'' Id has to be unique. It cannot be the same as an existing sku.

        In case no category code is added, the code should be default.

        ''type'' field should be either ''single'' or ''multiple.''

        Parameters:'
      operationId: addNewProducts
      tags:
      - Products
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            example: "{\n\t \"name\": \"Batman451\",\n    \"category_code\": \"default\",\n    \"type\": \"Single\",\n    \"qty\": \"10\",\n    \"sku\": \"b118771212\",\n    \"qc_details\": {\n        \"product_image\": \"https://kr-multichannel-stage.s3.ap-south-1.amazonaws.com/1310/qc_product_img/538c2939-24e7-4b60-98cd-b13cee264c1e.jpg\",\n        \"brand\": \"redlabel\",\n        \"color\": \"white\",\n        \"size\": \"L\",\n        \"product_imei\": \"\",\n        \"serial_no\": \"790878\",\n        \"ean_barcode\": \"\",\n        \"check_damaged_product\": true\n}"
      responses:
        '201':
          description: Successful Call
        '422':
          description: Missing Fields
          content:
            application/json:
              examples:
                Missing-Fields:
                  value:
                    message: There were errors in adding new product!
                    errors:
                      sku:
                      - The sku field is required.
                    status_code: 422
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      sku:
                        type: array
                        items:
                          type: string
                  status_code:
                    type: integer
