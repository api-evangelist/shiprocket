openapi: 3.2.0
info:
  title: Shiprocket Orders API
  version: v1
  description: 'Shiprocket''s public REST API (v1/external) for eCommerce shipping and order management: authentication, order create/update/cancel/import, courier serviceability and AWB assignment, pickup scheduling, labels/manifests/invoices, shipment tracking, NDR actions, returns and exchanges, hyperlocal and international shipping, products, listings, channels, inventory, countries/postcodes, wallet balance, statements and discrepancies.'
  termsOfService: https://www.shiprocket.in/terms-conditions/
  contact:
    name: Shiprocket API integration support
    email: integration@shiprocket.com
    url: https://apidocs.shiprocket.in/
servers:
- url: https://apiv2.shiprocket.in
  description: Production
security:
- bearerAuth: []
tags:
- name: Orders
  description: 'These APIs can be used to get details about your created orders, as well as manage them, which include fetching orders from your channel, syncing their status, and exporting them to a CSV file.

    Filters:

    The ''filter'' values are mentioned below. Use these to filter your data:'
paths:
  /v1/external/orders:
    get:
      summary: Get all Orders
      description: 'This API call will display a list of all created and available orders in your Shiprocket account. The product and shipment details are displayed as sub-arrays within each order detail.

        You can also sort and filter the data according to your needs by passing the optional parameters. Not passing anything will display the data in the default format.

        You can also fetch the data based on the order update date. PFB the validations:

        1. if updated_to => passed and updated_from not passed =>, error will come => Please send update_from date along with update_to date

        2. if updated_from => passed and updated_to => paased => and from-to > 30 then error => Difference between updated_from and update_to date should not be greater than 30 days.

        3. if updated_From Updated_from date should not be less than 30 days from current date

        Parameters:'
      operationId: getAllOrders
      tags:
      - Orders
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        description: The page number to display.
      - name: per_page
        in: query
        schema:
          type: integer
        description: The number of entries per page.
      - name: sort
        in: query
        schema:
          type: string
        description: 'Sort conditions: ASC or DESC'
      - name: sort_by
        in: query
        schema:
          type: string
        description: 'The Field to sort by: id or status'
      - name: to
        in: query
        schema:
          type: string
        description: The end date.
      - name: from
        in: query
        schema:
          type: string
        description: The start date.
      - name: filter_by
        in: query
        schema:
          type: string
        description: Field to filter by.
      - name: filter
        in: query
        schema:
          type: string
        description: Value of the field
      - name: search
        in: query
        schema:
          type: string
        description: Search for AWB or by Channel order_id (order id specified by you).
      - name: pickup_location
        in: query
        schema:
          type: string
        description: Search Orders on the basis of pickup location.
      - name: channel_id
        in: query
        schema:
          type: integer
        description: Channel ID Returned in Get Integrated Channels API
      - name: fbs
        in: query
        schema:
          type: integer
        description: Use this filter if you want to view and filter the SRF orders
      - name: fbs_all_orders
        in: query
        schema:
          type: integer
        description: Use this filter if you want to view both SRF and Last mile (core) orders
