  /v1/external/orders/show/{id}:
    get:
      summary: Get Specific Order Details
      description: 'Get the order and shipment details of a particular order through this API by passing the Shiprocket order_id in the endpoint URL itself — type in your order_id in place of {id}.

        No other body parameters are required.

        Note:

        For SRF orders, you''ll receive an extra parameter viz., fulfillment_status. This key will have four values:

        Ready to Pack,

        Packed

        Added to Picklist

        Picked up

        Path:'
      operationId: getSpecificOrderDetails
      tags:
      - Orders
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
