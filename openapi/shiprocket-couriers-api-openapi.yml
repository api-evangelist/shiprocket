openapi: 3.2.0
info:
  title: Shiprocket Couriers API
  version: v1
  description: 'Shiprocket''s public REST API (v1/external) for eCommerce shipping and order management: authentication, order create/update/cancel/import, courier serviceability and AWB assignment, pickup scheduling, labels/manifests/invoices, shipment tracking, NDR actions, returns and exchanges, hyperlocal and international shipping, products, listings, channels, inventory, countries/postcodes, wallet balance, statements and discrepancies.'
  termsOfService: https://www.shiprocket.in/terms-conditions/
  contact:
    name: Shiprocket API integration support
    email: integration@shiprocket.com
    url: https://apidocs.shiprocket.in/
servers:
- url: https://apiv2.shiprocket.in
  description: Production
security:
- bearerAuth: []
tags:
- name: Couriers
  description: 'Use these APIs to assign AWB to your order, check for courier serviceability, and request for the pickup of your order.

    All available couriers, along with their codes, are mentioned below:'
paths:
  /v1/external/courier/assign/awb:
    post:
      summary: Generate AWB for Shipment
      description: 'This API can be used to assign the AWB (Air Waybill Number) to your shipment. The AWB is a unique number that helps you track the shipment and get details about it.

        Parameters:'
      operationId: generateAWBForShipment
      tags:
      - Couriers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shipment_id:
                  type: integer
                  description: The shipment id of the order you want to create the AWB for.
                courier_id:
                  type: integer
                  description: The courier id of the courier service you want to select. The default courier is selected in case no id is specified.
                status:
                  type: string
                  description: 'Use this to change the courier of a shipment. Value: reassign. Note that this can be done only once in 24 hours.'
              required:
              - shipment_id
            example:
              shipment_id: ''
              courier_id: ''
              status: ''
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    awb_assign_status: 1
                    response:
                      data:
                        courier_company_id: 142
                        awb_code: '321055706540'
                        cod: 0
                        order_id: 281248157
                        shipment_id: 16090281
                        awb_code_status: 1
                        assigned_date_time:
                          date: '2022-11-25 11:17:52.878599'
                          timezone_type: 3
                          timezone: Asia/Kolkata
                        applied_weight: 0.5
                        company_id: 25149
                        courier_name: Amazon Surface
                        child_courier_name: null
                        pickup_scheduled_date: '2022-11-25 14:00:00'
                        routing_code: ''
                        rto_routing_code: ''
                        invoice_no: retail5769122647118
                        transporter_id: ''
                        transporter_name: ''
                        shipped_by:
                          shipper_company_name: manoj
                          shipper_address_1: Aligarh
                          shipper_address_2: noida
                          shipper_city: Jammu
                          shipper_state: Jammu & Kashmir
                          shipper_country: India
                          shipper_postcode: '110030'
                          shipper_first_mile_activated: 0
                          shipper_phone: '8976967989'
                          lat: '32.731899'
                          long: '74.860376'
                          shipper_email: hdhd@gshd.com
                          rto_company_name: test
                          rto_address_1: Unnamed Road, Bengaluru, Karnataka 560060, India
                          rto_address_2: Katrabrahmpur
                          rto_city: Bangalore
                          rto_state: Karnataka
                          rto_country: India
                          rto_postcode: '560060'
                          rto_phone: '9999999999'
                          rto_email: test@test.com
              schema:
                type: object
                properties:
                  awb_assign_status:
                    type: integer
                  response:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          courier_company_id:
                            type: integer
                          awb_code:
                            type: string
                          cod:
                            type: integer
                          order_id:
                            type: integer
                          shipment_id:
                            type: integer
                          awb_code_status:
                            type: integer
                          assigned_date_time:
                            type: object
                            properties:
                              date:
                                type: string
                              timezone_type:
                                type: integer
                              timezone:
                                type: string
                          applied_weight:
                            type: number
                          company_id:
                            type: integer
                          courier_name:
                            type: string
                          child_courier_name: {}
                          pickup_scheduled_date:
                            type: string
                          routing_code:
                            type: string
                          rto_routing_code:
                            type: string
                          invoice_no:
                            type: string
                          transporter_id:
                            type: string
                          transporter_name:
                            type: string
                          shipped_by:
                            type: object
                            properties:
                              shipper_company_name:
                                type: string
                              shipper_address_1:
                                type: string
                              shipper_address_2:
                                type: string
                              shipper_city:
                                type: string
                              shipper_state:
                                type: string
                              shipper_country:
                                type: string
                              shipper_postcode:
                                type: string
                              shipper_first_mile_activated:
                                type: integer
                              shipper_phone:
                                type: string
                              lat:
                                type: string
                              long:
                                type: string
                              shipper_email:
                                type: string
                              rto_company_name:
                                type: string
                              rto_address_1:
                                type: string
                              rto_address_2:
                                type: string
                              rto_city:
                                type: string
                              rto_state:
                                type: string
                              rto_country:
                                type: string
                              rto_postcode:
                                type: string
                              rto_phone:
                                type: string
                              rto_email:
                                type: string
        '422':
          description: Missing Fields
          content:
            application/json:
              examples:
                Missing-Fields:
                  value:
                    message: Required field missing
                    errors:
                      shipment_id:
                      - The shipment id field is required.
                    status_code: 422
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      shipment_id:
                        type: array
                        items:
                          type: string
                  status_code:
                    type: integer
        '400':
          description: Invalid Data
          content:
            application/json:
              examples:
                Invalid-Data:
                  value:
                    message: Oops! Cannot reassign courier for this shipment.
                    status_code: 400
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status_code:
                    type: integer
