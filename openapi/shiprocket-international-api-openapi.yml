  /v1/external/international/orders/create/adhoc:
    post:
      summary: Create order
      description: 'Use this API to create a quick custom order. Quick orders are the ones where we do not store the product details in the master catalogue.

        You have to pass all the required params at the minimum to create a quick custom order. You can add additional parameters as per your preference.

        Note:

        In case the ''shipping_is_billing'' field is false, further shipping detail fields are required.

        If no channel id is passed, the order will be assigned to the default custom channel. If the channel id is not known, use the ''Get All Channels'' API to get the list of all integrated channels in your Shiprocket account.

        order_id field cannot be equal to an already existing id. Doing so does not change or affect the existing order.

        New orders cannot be created with order id''s same as that of cancelled orders. If error 422 shows up despite filling in the correct details, consider changing the order_id.

        Be sure to input the correct calculated sub_total amount. The total is not calculated automatically through the API.

        The ''order_id'' returned in the response is the Shiprocket order_id. Please save this order ID as we will use this in future API calls.

        Parameters:'
      operationId: createOrder
      tags:
      - International
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                  description: 'The order id you want to specify to the order. Max char: 50. (Avoid passing character values as this contradicts some other API calls).'
                isd_code:
                  type: string
                billing_isd_code:
                  type: string
                  description: ISD code of the billing address.
                order_date:
                  type: string
                  description: The date of order creation in yyyy-mm-dd format. Time is additional.
                channel_id:
                  type: integer
                  description: Mention this in case you need to assign the order to a particular channel. Deafult is 'Custom'.
                billing_customer_name:
                  type: string
                  description: First name of the billed customer.
                billing_last_name:
                  type: string
                  description: Last name of the billed customer.
                billing_address:
                  type: string
                  description: address details of the billed customer.
                billing_address_2:
                  type: string
                  description: Further address details of the billed customer.
                billing_city:
                  type: string
                  description: 'Billing address city. Max char: 30.'
                billing_state:
                  type: string
                  description: Billing address state.
                billing_country:
                  type: string
                  description: Billing address country.
                billing_pincode:
                  type: integer
                  description: Pincode of the billing address.
                landmark:
                  type: string
                shipping_is_billing:
                  type: integer
                  description: Whether the shipping address is the same as billing address. 1 or 'true' for yes and 0 or 'false' for no.
                shipping_customer_name:
                  type: string
                  description: Name of the customer the order is shipped to. Required in case billing is not same as shipping.
                shipping_last_name:
                  type: string
                  description: Last name of the shipping customer.
                shipping_address:
                  type: string
                  description: Address of the Shipping customer. Required in case billing is not same as shipping.
                shipping_address_2:
                  type: string
                  description: Further address details of shipping customer.
                shipping_city:
                  type: string
                  description: Shipping address city.
                order_type:
                  type: integer
                  description: Key to differentiate between Essentials or Non Essentials Shipments. Order type can only be ESSENTIALS or NON ESSENTIALS. Please note it is case sensitive and blank values are allowed.
                shipping_country:
                  type: string
                  description: Shipping address country.
                shipping_pincode:
                  type: integer
                  description: Shipping address pincode.
                shipping_state:
                  type: string
                  description: Shipping address state.
                shipping_email:
                  type: string
                  description: Email of the shipping customer.
                product_category:
                  type: string
                shipping_phone:
                  type: integer
                  description: Phone no. of the shipping customer.
                billing_alternate_phone:
                  type: integer
                  description: Alternate phone number of the billing customer.
                order_items:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      sku:
                        type: string
                      category_name:
                        type: string
                      tax:
                        type: string
                      hsn:
                        type: string
                      units:
                        type: string
                      selling_price:
                        type: string
                      discount:
                        type: string
                      category_id:
                        type: string
                      caetgroy_code:
                        type: string
                  description: List of items and their relevant fields in the form of Array.
                payment_method:
                  type: string
                  description: The method of payment. Can be either COD (Cash on delivery) Or Prepaid.
                shipping_charges:
                  type: integer
                  description: Shipping charges if any in Rupee.
                giftwrap_charges:
                  type: integer
                  description: Giftwrap charges if any in Rupee.
                transaction_charges:
                  type: integer
                  description: Transaction charges if any in Rupee.
                total_discount:
                  type: integer
                  description: The total discount amount in Rupee.
                sub_total:
                  type: integer
                  description: Calculated sub total amount in Rupee after deductions.
                weight:
                  type: number
                  description: The weight of the item in kgs. Must be more than 0.
                length:
                  type: integer
                  description: The length of the item in cms. Must be more than 0.5.
                breadth:
                  type: integer
                  description: The breadth of the item in cms. Must be more than 0.5.
                height:
                  type: integer
                  description: The height of the item in cms. Must be more than 0.5.
                pickup_location_id:
                  type: integer
                reseller_name:
                  type: string
                  description: 'The ''from'' name if you want to print. Use ''Reseller: [name]'''
                company_name:
                  type: string
                  description: Name of the company.
                ewaybill_no:
                  type: string
                  description: Details relating to the shipment of goods. .
                customer_gstin:
                  type: string
                  description: Goods and Services Tax Identification Number.
                is_order_revamp:
                  type: integer
                is_document:
                  type: integer
                delivery_challan:
                  type: boolean
                order_tag:
                  type: string
                purpose_of_shipment:
                  type: integer
                  description: The purpose of the shipment. values are 0 - gift, 1- sample, commercial - 2.
                currency:
                  type: string
                  description: The currency of the order. Possible values are INR,USD,GBP, EUR, AUD, CAD, SAR, AED,SGD
                reasonOfExport:
                  type: integer
                  description: The reason for the export. Possible values are 0 - BONAFIDE_SAMPLE, 1 - SAMPLE, 2 - GIFT, 3 - COMMERCIAL
                commodity:
                  type: boolean
                  description: Indicates if the order is a commodity or not
                mies:
                  type: string
                igstPaymentStatus:
                  type: string
                  description: possible values are 'A'- not applicable, 'B'- LUT or Export under Bond, 'C'- Export Against Payment of IGST
                Terms_Of_Invoice:
                  type: string
                  description: FOB and CIF
                is_insurance_opt:
                  type: boolean
              required:
              - order_id
              - order_date
              - billing_customer_name
              - billing_city
              - billing_pincode
              - billing_state
              - billing_country
              - shipping_is_billing
              - order_items
              - payment_method
              - sub_total
              - length
              - breadth
              - height
              - weight
              - currency
              - reasonOfExport
              - Terms_Of_Invoice
            example:
              order_id: 172647058
              isd_code: '+1'
              billing_isd_code: ''
              order_date: '2022-03-30T00:34:12.311Z'
              channel_id: 2252386
              billing_customer_name: 'Elena  '
              billing_last_name: ''
              billing_address: Plot No. 348, Panchkula, 134113, India
              billing_address_2: ''
              billing_city: Panchkula
              billing_state: Haryana
              billing_country: India
              billing_pincode: '134113'
              landmark: ''
              shipping_is_billing: 1
              shipping_customer_name: 'Elena '
              shipping_last_name: ''
              shipping_address: Plot No. 348, Panchkula, 134113, India
              shipping_address_2: ''
              shipping_city: Dallas
              order_type: 1
              shipping_country: United States
              shipping_pincode: '134090'
              shipping_state: Texas
              shipping_email: test.test@shiprocket.com
              product_category: ''
              shipping_phone: 9762343722
              billing_alternate_phone: ''
              order_items:
              - name: Combo of 4 Way Spanner and Hydraulic trolly Jack
                sku: 5-47606
                category_name: Default Category
                tax: ''
                hsn: ''
                units: '1'
                selling_price: '100'
                discount: ''
                category_id: ''
                caetgroy_code: ''
              payment_method: Prepaid
              shipping_charges: 0
              giftwrap_charges: 0
              transaction_charges: 0
              total_discount: 0
              sub_total: 100
              weight: 0.41
              length: 10
              breadth: 10
              height: 10
              pickup_location_id: 255
              reseller_name: ''
              company_name: ''
              ewaybill_no: ''
              customer_gstin: ''
              is_order_revamp: 1
              is_document: 0
              delivery_challan: false
              order_tag: ''
              purpose_of_shipment: 0
              currency: USD
              reasonOfExport: 2
              commodity: 'true'
              mies: 'true'
              igstPaymentStatus: C
              Terms_Of_Invoice: FOB
              is_insurance_opt: false
      responses:
        '200':
          description: Create order (Sucess Response)
          content:
            application/json:
              examples:
                Create-order-Sucess-Response:
                  value:
                    order_id: 153210169
                    shipment_id: 152757155
                    status: NEW
                    status_code: 1
                    onboarding_completed_now: 0
                    awb_code: ''
                    courier_company_id: ''
                    courier_name: ''
              schema:
                type: object
                properties:
                  order_id:
                    type: integer
                  shipment_id:
                    type: integer
                  status:
                    type: string
                  status_code:
                    type: integer
                  onboarding_completed_now:
                    type: integer
                  awb_code:
                    type: string
                  courier_company_id:
                    type: string
                  courier_name:
                    type: string
        '422':
          description: Create order (Failure Response)
          content:
            application/json:
              examples:
                Create-order-Failure-Response:
                  value:
                    message: Oops! Invalid Data.
                    errors:
                      payment_method:
                      - The payment method field is required.
                    status_code: 422
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      payment_method:
                        type: array
                        items:
                          type: string
                  status_code:
                    type: integer
