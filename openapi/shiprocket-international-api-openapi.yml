openapi: 3.2.0
info:
  title: Shiprocket International API
  version: v1
  description: 'Shiprocket''s public REST API (v1/external) for eCommerce shipping and order management: authentication, order create/update/cancel/import, courier serviceability and AWB assignment, pickup scheduling, labels/manifests/invoices, shipment tracking, NDR actions, returns and exchanges, hyperlocal and international shipping, products, listings, channels, inventory, countries/postcodes, wallet balance, statements and discrepancies.'
  termsOfService: https://www.shiprocket.in/terms-conditions/
  contact:
    name: Shiprocket API integration support
    email: integration@shiprocket.com
    url: https://apidocs.shiprocket.in/
servers:
- url: https://apiv2.shiprocket.in
  description: Production
security:
- bearerAuth: []
tags:
- name: International
  description: These endpoints are used for operations related to international orders and shipments.
paths:
  /v1/external/courier/generate/pickup:
    post:
      summary: Request for Shipment Pickup
      description: 'Use this API to create a pickup request for your order shipment. The API returns the pickup status along with the estimated pickup time. You will have to call the ''Generate Manifest'' API after the successful response of this API.

        Note:

        The AWB must be already generated for the shipment id to generate the pickup request.

        Only one shipment_id can be passed at a time.

        In case the pickup_date falls on a holiday or Sunday, the shipment will be booked for the next available date.

        Parameters:'
      operationId: requestForShipmentPickup
      tags:
      - International
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shipment_id:
                  type: array
                  items:
                    type: integer
                  description: The shipment id of the shipment which is requested for pickup.
              required:
              - shipment_id
            example:
              shipment_id:
              - 16090109
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    pickup_status: 1
                    response:
                      pickup_scheduled_date: '2021-12-10 12:39:54'
                      pickup_token_number: 'Reference No: 194_BIGFOOT 1966840_11122021'
                      status: 3
                      others: '{"tier_id":5,"etd_zone":"z_e","etd_hours":"{\"assign_to_pick\":6.9000000000000004,\"pick_to_ship\":22.600000000000001,\"ship_to_deliver\":151.40000000000001,\"etd_zone\":\"z_e\",\"pick_to_ship_table\":\"dev_etd_pickup_to_ship\",\"ship_to_deliver_table\":\"dev_etd_ship_to_deliver\"}","actual_etd":"2021-12-18 00:36:03","routing_code":"S2\/S-69\/1B\/016","addition_in_etd":["deduction_of_6_and_half_hours"],"shipment_metadata":{"type":"ship","device":"WebKit","platform":"desktop","client_ip":"94.237.77.195","created_at":"2021-12-10 12:36:03","request_type":"web"},"templatized_pricing":0,"selected_courier_type":"Best in price","recommended_courier_data":{"etd":"Dec 19, 2021","price":153,"rating":3.6,"courier_id":54},"recommendation_advance_rule":null,"dynamic_weight":"1.00"}'
                      pickup_generated_date:
                        date: '2021-12-10 12:39:54.034695'
                        timezone_type: 3
                        timezone: Asia/Kolkata
                      data: Pickup is confirmed by Xpressbees 1kg For AWB :- 143254213727423
              schema:
                type: object
                properties:
                  pickup_status:
                    type: integer
                  response:
                    type: object
                    properties:
                      pickup_scheduled_date:
                        type: string
                      pickup_token_number:
                        type: string
                      status:
                        type: integer
                      others:
                        type: string
                      pickup_generated_date:
                        type: object
                        properties:
                          date:
                            type: string
                          timezone_type:
                            type: integer
                          timezone:
                            type: string
                      data:
                        type: string
        '400':
          description: Missing Fields
          content:
            application/json:
              examples:
                Missing-Fields:
                  value:
                    message: Invalid shipment id
                    status_code: 400
                Invalid-Data:
                  value:
                    message: Invalid shipment id
                    status_code: 400
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status_code:
                    type: integer
