  /v1/external/orders/cancel/shipment/awbs:
    post:
      summary: Cancel a Shipment
      description: 'Use this API to cancel a created shipment before the "Out for Pickup" state. Multiple AWBs can be passed together as an array to cancel them simultaneously.

        Limit: 2000 AWBs

        Parameters:'
      operationId: cancelAShipment
      tags:
      - Shipments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                awbs:
                  type: array
                  items:
                    type: string
                  description: The AWB/List of AWBs that need to be canceled.
              required:
              - awbs
            example:
              awbs:
              - '19041211125783'
      responses:
        '204':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    message: Bulk Shipment cancellation is in progress. Please wait for some time.
              schema:
                type: object
                properties:
                  message:
                    type: string
components:
