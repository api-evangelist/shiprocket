openapi: 3.2.0
info:
  title: Shiprocket Shipments API
  version: v1
  description: 'Shiprocket''s public REST API (v1/external) for eCommerce shipping and order management: authentication, order create/update/cancel/import, courier serviceability and AWB assignment, pickup scheduling, labels/manifests/invoices, shipment tracking, NDR actions, returns and exchanges, hyperlocal and international shipping, products, listings, channels, inventory, countries/postcodes, wallet balance, statements and discrepancies.'
  termsOfService: https://www.shiprocket.in/terms-conditions/
  contact:
    name: Shiprocket API integration support
    email: integration@shiprocket.com
    url: https://apidocs.shiprocket.in/
servers:
- url: https://apiv2.shiprocket.in
  description: Production
security:
- bearerAuth: []
tags:
- name: Shipments
  description: 'These APIs can be used to get shipment details. You can either get all shipment details at once or the details of a particular shipment.

    Below are some associated status codes related to the shipments:

    Status Codes:'
paths:
  /v1/external/shipments:
    get:
      summary: Get All Shipment Details
      description: 'Use this API to get the shipment details of all the shipments in your Shiprocket account.

        The data is displayed in the default format if no filter or sort condition is passed. You can use the filter and sort conditions to streamline your data.

        Parameters:'
      operationId: getAllShipmentDetails
      tags:
      - Shipments
      parameters:
      - name: sort
        in: query
        schema:
          type: string
        description: 'The sort format: ASC or DESC'
      - name: sort_by
        in: query
        schema:
          type: string
        description: The field to sort by.
      - name: filter
        in: query
        schema:
          type: string
        description: The filter value.
      - name: filter_by
        in: query
        schema:
          type: string
        description: The filed to filter by.
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    data:
                    - number: ''
                      code: ''
                      id: 3322791
                      order_id: 3324748
                      products:
                      - name: gsdgw
                        sku: '123'
                        quantity: 2
                      awb: '109123535421'
                      status: CANCELED
                      created_at: 28th Aug 2018 07:11 PM
                      channel_id: 76893
                      channel_name: CUSTOM
                      base_channel_code: CS
                      payment_method: cod
                    - number: ''
                      code: ''
                      id: 3322802
                      order_id: 3324759
                      products:
                      - name: Black tshirt XL
                        sku: BlackTshirt
                        quantity: 2
                      awb: '109123535594'
                      status: CANCELED
                      created_at: 28th Aug 2018 07:14 PM
                      channel_id: 76893
                      channel_name: CUSTOM
                      base_channel_code: CS
                      payment_method: cod
                    meta:
                      pagination:
                        total: 19631
                        count: 15
                        per_page: 2
                        current_page: 1
                        total_pages: 1309
                        links:
                          next: https://apiv2.shiprocket.in/v1/external/shipments?page=2
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: string
                        code:
                          type: string
                        id:
                          type: integer
                        order_id:
                          type: integer
                        products:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              sku:
                                type: string
                              quantity:
                                type: integer
                        awb:
                          type: string
                        status:
                          type: string
                        created_at:
                          type: string
                        channel_id:
                          type: integer
                        channel_name:
                          type: string
                        base_channel_code:
                          type: string
                        payment_method:
                          type: string
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                          count:
                            type: integer
                          per_page:
                            type: integer
                          current_page:
                            type: integer
                          total_pages:
                            type: integer
                          links:
                            type: object
                            properties:
                              next:
                                type: string
        '404':
          description: Wrong Endpoint
          content:
            application/json:
              examples:
                Wrong-Endpoint:
                  value:
                    message: 404 Not Found
                    status_code: 404
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status_code:
                    type: integer
