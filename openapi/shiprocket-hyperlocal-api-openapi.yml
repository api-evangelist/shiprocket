  /v1/external/orders:
    get:
      summary: Get all Orders
      description: 'This API call will display a list of all created and available orders in your Shiprocket account. The product and shipment details are displayed as sub-arrays within each order detail.

        You can also sort and filter the data according to your needs by passing the optional parameters. Not passing anything will display the data in the default format.

        You can also fetch the data based on the order update date. PFB the validations:

        1. if updated_to => passed and updated_from not passed =>, error will come => Please send update_from date along with update_to date

        2. if updated_from => passed and updated_to => paased => and from-to > 30 then error => Difference between updated_from and update_to date should not be greater than 30 days.

        3. if updated_From Updated_from date should not be less than 30 days from current date

        Parameters:'
      operationId: getAllOrders
      tags:
      - Hyperlocal
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        description: The page number to display.
      - name: per_page
        in: query
        schema:
          type: integer
        description: The number of entries per page.
      - name: sort
        in: query
        schema:
          type: string
        description: 'Sort conditions: ASC or DESC'
      - name: sort_by
        in: query
        schema:
          type: string
        description: 'The Field to sort by: id or status'
      - name: to
        in: query
        schema:
          type: string
        description: The end date.
      - name: from
        in: query
        schema:
          type: string
        description: The start date.
      - name: filter_by
        in: query
        schema:
          type: string
        description: Field to filter by.
      - name: filter
        in: query
        schema:
          type: string
        description: Value of the field
      - name: search
        in: query
        schema:
          type: string
        description: Search for AWB or by Channel order_id (order id specified by you).
      - name: pickup_location
        in: query
        schema:
          type: string
        description: Search Orders on the basis of pickup location.
      - name: channel_id
        in: query
        schema:
          type: integer
        description: Channel ID Returned in Get Integrated Channels API
      - name: fbs
