  /v1/external/settings/company/addpickup:
    post:
      summary: Add a New Pickup Location
      description: 'This API can be used to add a new pickup location to your account. Pass the minimum required parameters to add the location. Further details to the address can be added if required.

        Parameters:'
      operationId: addANewPickupLocation
      tags:
      - Pickup Addresses
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_location:
                  type: string
                  description: The nickname of the new pickup location. Max 36 characters.
                name:
                  type: string
                  description: The shipper's name.
                email:
                  type: string
                  description: The shipper's email address.
                phone:
                  type: integer
                  description: Shipper's phone number.
                address:
                  type: string
                  description: Shipper's primary address. Max 80 characters.
                address_2:
                  type: string
                  description: Additional address details.
                city:
                  type: string
                  description: Pickup location city name.
                state:
                  type: string
                  description: Pickup location state name.
                country:
                  type: string
                  description: Pickup location country.
                pin_code:
                  type: integer
                  description: Pickup location pincode.
              required:
              - pickup_location
              - name
              - email
              - phone
              - address
              - city
              - state
              - country
              - pin_code
            example:
              pickup_location: ''
              name: ''
              email: ''
              phone: ''
              address: ''
              address_2: ''
              city: ''
              state: ''
              country: ''
              pin_code: ''
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    success: true
                    address:
