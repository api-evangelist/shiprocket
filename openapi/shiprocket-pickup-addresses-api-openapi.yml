openapi: 3.2.0
info:
  title: Shiprocket Pickup Addresses API
  version: v1
  description: 'Shiprocket''s public REST API (v1/external) for eCommerce shipping and order management: authentication, order create/update/cancel/import, courier serviceability and AWB assignment, pickup scheduling, labels/manifests/invoices, shipment tracking, NDR actions, returns and exchanges, hyperlocal and international shipping, products, listings, channels, inventory, countries/postcodes, wallet balance, statements and discrepancies.'
  termsOfService: https://www.shiprocket.in/terms-conditions/
  contact:
    name: Shiprocket API integration support
    email: integration@shiprocket.com
    url: https://apidocs.shiprocket.in/
servers:
- url: https://apiv2.shiprocket.in
  description: Production
security:
- bearerAuth: []
tags:
- name: Pickup Addresses
  description: Use these APIs to get a list of all available pickup locations in your account or add a new pickup location.
paths:
  /v1/external/settings/company/pickup:
    get:
      summary: Get All Pickup Locations
      description: 'Get a list of all pickup locations that have been added to your Shiprocket account through this API.

        No parameters are required to use this API.'
      operationId: getAllPickupLocations
      tags:
      - Pickup Addresses
      responses:
        '200':
          description: Successful Call
          content:
            application/json:
              examples:
                Successful-Call:
                  value:
                    data:
                      shipping_address:
                      - id: 4984500
                        pickup_location: Casa Moderna
                        address_type: null
                        address: 1900 GF, Sector 45
                        address_2: near Park 1
                        updated_address: false
                        old_address: ''
                        old_address2: ''
                        tag: ''
                        tag_value: ''
                        instruction: ''
                        city: Gurgaon
                        state: Haryana
                        country: India
                        pin_code: '122003'
                        email: abcxyz@gmail.com
                        is_first_mile_pickup: 0
                        phone: '9667667496'
                        name: CASA MODERNA
                        company_id: 1138022
                        gstin: null
                        vendor_name: null
                        status: 2
                        phone_verified: 1
                        lat: '28.44786453607'
                        long: '77.074250297017'
                        open_time: null
                        close_time: null
                        warehouse_code: null
                        alternate_phone: ''
                        rto_address_id: 4984500
                        lat_long_status: 1
                        new: 1
                        associated_rto_address: null
                        is_primary_location: 1
                      allow_more: 'true'
                      is_blackbox_seller: false
                      company_name: CASA MODERNA
                      recent_addresses: []
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      shipping_address:
                        type: array
                        items:
                          type: object
                          properties:
