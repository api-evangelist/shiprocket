                      pickup_code: TESTADI
                      address: Mutant Facility, Sector 3
                      address_2: ''
                      address_type: null
                      city: South West Delhi
                      state: Maharshtra
                      country: India
                      gstin: null
                      pin_code: '110022'
                      phone: '9777777779'
                      email: deadpool@chimichanga.com
                      name: Deadpool
                      alternate_phone: null
                      lat: null
                      long: null
                      status: 1
                      phone_verified: 0
                      rto_address_id: 1468067
                      extra_info: '{"source":3}'
                      updated_at: '2021-10-12 11:51:48'
                      created_at: '2021-10-12 11:51:48'
                      id: 1856901
                    pickup_id: 1856901
                    company_name: ShiprocketTest
                    full_name: API
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  address:
                    type: object
                    properties:
                      company_id:
                        type: integer
                      pickup_code:
                        type: string
                      address:
                        type: string
                      address_2:
                        type: string
                      address_type: {}
                      city:
                        type: string
                      state:
                        type: string
                      country:
                        type: string
                      gstin: {}
                      pin_code:
                        type: string
                      phone:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      alternate_phone: {}
                      lat: {}
                      long: {}
                      status:
                        type: integer
                      phone_verified:
                        type: integer
                      rto_address_id:
                        type: integer
                      extra_info:
                        type: string
                      updated_at:
                        type: string
                      created_at:
                        type: string
                      id:
                        type: integer
                  pickup_id:
                    type: integer
                  company_name:
                    type: string
                  full_name:
                    type: string
        '422':
          description: Missing Fields
          content:
            application/json:
              examples:
                Missing-Fields:
                  value:
                    message: Not a valid mobile number
                    errors:
                      phone:
                      - The phone field is required.
                    status_code: 422
              schema:
                type: object
                properties:
