  description: "The authentication token is an alphanumeric code, unique to your Shiprocket account, can\
    \ be used from any system to validate your API calls to access Shiprocket's resources. Shiprocket\
    \ API uses JWT tokens for validation.\n Use this API to validate your API user and obtain the authentication\
    \ token. Copy this token and use it further to validate your API calls. The validity of this token\
    \ is 10 days .\n Your API keys carry many privileges, so be sure to keep them secure! Do not share\
    \ your secret token in publicly accessible areas such as GitHub, client-side code, and so forth.\n\
    \ Steps To Use Token: \n Copy the token received in response.\n Include 'Authorization: Bearer [yourtokenvalue]'\
