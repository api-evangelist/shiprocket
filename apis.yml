  slug: kartrocket
  repo: https://github.com/api-evangelist/kartrocket
  confidence: high
  recommended_survivor: shiprocket
  basis: >-
    Same legal entity. all/kartrocket profiles BigFoot Retail Solutions Pvt Ltd under its FORMER brand
    (KartRocket) and already says so in its own description; its Website, docs (apidocs.shiprocket.in),
    API base (apiv2.shiprocket.in/v1/external), GitHub org (bfrs), MCP server and status page are all
    Shiprocket's. This record was created independently from the secondary-market harvest backlog under
    the company's CURRENT name. Shiprocket is the name the company trades under today (llms.txt, server.json
    websiteUrl, every host), so the merge should keep this slug and retire kartrocket as an alias, carrying
    kartrocket's kin/ score history. This pass enriched shiprocket fully (Postman collection, generated
    OpenAPI, well-known OAuth metadata, webhooks) because those artifacts are net-new to either record;
    the identity decision is deliberately left to a human.
  evidence:
  - url: https://www.shiprocket.in/llms.txt
    status: 200
    note: '"Shiprocket is India''s leading eCommerce enablement platform"'
  - url: https://api.github.com/users/bfrs
    status: 200
    note: org name "Shiprocket"
  - url: https://apidocs.shiprocket.in/
    status: 200
