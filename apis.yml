aid: shiprocket
name: Shiprocket
description: >-
  Shiprocket (BigFoot Retail Solutions Pvt Ltd, formerly KartRocket) is India's largest eCommerce shipping
  and enablement platform, aggregating 25+ courier partners into one panel for D2C brands, SMEs and enterprise
  sellers: domestic and hyperlocal shipping, cross-border (ShipX/CargoX), warehouse fulfillment, returns
  and NDR management, COD reconciliation, checkout (fastrr), capital and the Sense address-intelligence
  and RTO-prediction APIs. The public Shiprocket API (apiv2.shiprocket.in/v1/external, JWT bearer from
  an API-user login) covers order create/update/cancel, courier serviceability and AWB assignment, pickup
  scheduling, labels/manifests/invoices, tracking, returns/exchanges, NDR actions, products, listings,
  channels, inventory, wallet and statements, and is published as a public Postman collection with tracking
  webhooks. An official open-source MCP server (bfrs/shiprocket-mcp) exposes ten of those flows to AI
  agents.
url: https://raw.githubusercontent.com/api-evangelist/shiprocket/refs/heads/main/apis.yml
image: https://sr-website.shiprocket.in/wp-content/uploads/2025/02/OG-Image-for-Shiprocket.png
x-type: company
x-source: harvest:secondary-market
x-tier: stub
x-tier-reason: harvest
