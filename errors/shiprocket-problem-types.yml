- status: 400
  title: Bad Request
  description: The request was invalid or cannot be otherwise served.
  remediation: Check required fields and their formats.
- status: 401
  title: Unauthorized
  description: Error during validation — check your token or credentials.
  remediation: Re-login at POST /auth/login; tokens expire after 10 days.
- status: 403
  title: Forbidden
  description: Seen in the collection examples on courier/label operations when the resource is not permitted for
    the API user.
- status: 404
  title: Not Found
  description: The URI requested is invalid or the resource requested does not exist.
- status: 405
  title: Method Not Allowed
  description: The API was accessed using the wrong method.
  remediation: Check your HTTP method.
- status: 422
  title: Unprocessable Entity
  description: The request contains incorrect syntax or cannot be fulfilled; the body carries a per-field errors
    map.
  remediation: Fix the fields named in errors{}.
- status: 429
  title: Too Many Requests
  description: You have exceeded the API call rate limit.
  remediation: Back off and retry; no Retry-After or limit headers are documented.
- status: 500
  title: Internal Server Error
  description: Server error; some APIs return this on syntax or parameter errors.
  remediation: Contact support if it persists.
- status: 502
  title: Bad Gateway
  description: Server error.
- status: 503
